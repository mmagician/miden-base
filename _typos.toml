[default]
extend-ignore-identifiers-re = [
    # Ignore identifiers with "2nd" (second)
    ".*2nd.*",
    # Ignore specific error constants
    "ERR_PROLOGUE_NEW_NON_FUNGIBLE_FAUCET_RESERVED_SLOT_MUST_BE_VALID_EMPY_SMT",
    "ACCOUNT_DELTA_STORGE_MAP_SECTION",
    # Test variable names
    "succesful_note_.*",
]

[default.extend-identifiers]
# Specific identifiers that should be allowed
AttributeIDSupressMenu = "AttributeIDSupressMenu"
countr_one = "countr_one"  # C++ specific
NDArray = "NDArray"  # Python specific  
flate2 = "flate2"  # Go stdlib reference

[default.extend-words]
# Domain-specific terms
layed = "layed"  # Used consistently in comments about memory layout
EMPY = "EMPY"  # Used in error constant names
STORGE = "STORGE"  # Used in constant names
succesful = "succesful"  # Used in test variable names
